name: upstream-compat

# Separate from `verify.yml` on purpose.
#
# Independent review F-09: a green `verify` workflow must never be read as "the upstream
# 8,004-test baseline passed". That baseline needs a ~2.7 GB dependency install and a
# 5-minute suite, which is too heavy for every PR. This workflow is the deliberate,
# explicit compatibility check instead — it runs on a schedule and on demand.
#
# It is EXPECTED to be slow. It is also expected to fail when upstream moves.

on:
  schedule:
    # Weekly. Upstream releases faster than this, but a weekly drift signal is enough to
    # stop a silent breakage without burning CI minutes daily.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "OpenCode ref to test (tag, branch or SHA)"
        required: false
        default: "v2.3.2"

concurrency:
  group: upstream-compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"

jobs:
  upstream:
    name: upstream baseline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Check out the pinned upstream
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.ref || 'v2.3.2' }}"
          git clone --filter=blob:none --no-checkout \
            https://github.com/anomalyco/opencode.git "$RUNNER_TEMP/opencode"
          git -C "$RUNNER_TEMP/opencode" checkout "$ref"
          echo "testing ref: $ref @ $(git -C "$RUNNER_TEMP/opencode" rev-parse HEAD)"

      - name: Install upstream dependencies
        run: bun install --frozen-lockfile
        working-directory: ${{ runner.temp }}/opencode

      # The shell parity suite needs bash >= 4; macOS ships 3.2.
      - name: Ensure bash >= 4
        run: |
          set -euo pipefail
          if [ "$(bash -c 'echo ${BASH_VERSINFO[0]}')" -lt 4 ]; then
            brew install bash
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          bash --version | head -1

      # The upstream filesystem suite shells out to a ripgrep binary and, when it cannot find
      # one on PATH, tries to DOWNLOAD it mid-test. The test harness forbids network access, so
      # without this step 28 Ripgrep tests fail on every platform with:
      #   error: test attempted network request: GET .../ripgrep-15.1.0-<target>.tar.gz
      # Locally this was invisible because Homebrew's rg 15.1.0 was already on PATH.
      #
      # Install exactly the version upstream pins, and verify its SHA-256 against
      # packages/core/src/ripgrep/binary.ts so the dependency stays pinned rather than "latest".
      - name: Install the pinned ripgrep (upstream requires rg on PATH)
        shell: bash
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1 && [ "$(rg --version | head -1 | awk '{print $2}')" = "15.1.0" ]; then
            echo "rg 15.1.0 already present: $(command -v rg)"
            exit 0
          fi
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) target="aarch64-apple-darwin";    sha="378e973289176ca0c6054054ee7f631a065874a352bf43f0fa60ef079b6ba715"; ext="tar.gz" ;;
            Linux-x86_64) target="x86_64-unknown-linux-musl"; sha="1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599"; ext="tar.gz" ;;
            Linux-aarch64) target="aarch64-unknown-linux-gnu"; sha="2b661c6ef508e902f388e9098d9c4c5aca72c87b55922d94abdba830b4dc885e"; ext="tar.gz" ;;
            *) echo "unsupported runner: $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/ripgrep"
          mkdir -p "$dir"
          url="https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-${target}.${ext}"
          echo "downloading $url"
          curl -fsSL "$url" -o "$dir/rg.${ext}"
          echo "${sha}  $dir/rg.${ext}" | shasum -a 256 -c -
          tar xzf "$dir/rg.${ext}" -C "$dir"
          install -d "$HOME/.local/bin"
          install -m 0755 "$dir/ripgrep-15.1.0-${target}/rg" "$HOME/.local/bin/rg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rg" --version | head -1

      - name: Upstream core suite
        run: bun run --cwd packages/core test
        working-directory: ${{ runner.temp }}/opencode

      - name: Upstream CLI suite
        run: bun run --cwd packages/cli test
        working-directory: ${{ runner.temp }}/opencode

      - name: Upstream SDK suite
        run: bun run --cwd packages/sdk test
        working-directory: ${{ runner.temp }}/opencode

      # Only now, with a real upstream tree present, can the compatibility report run.
      - name: Upstream compatibility report
        run: |
          set -euo pipefail
          python3 scripts/upstream_sync.py \
            --repo "$RUNNER_TEMP/opencode" \
            --offline
        # --offline is deliberate: the report compares against the checked-out ref, and
        # resolving a *further* target would need network access to a different revision.

      - name: Summary
        if: always()
        run: |
          {
            echo "## Upstream compatibility"
            echo ""
            echo "Ref under test: \`${{ github.event.inputs.ref || 'v2.3.2' }}\`"
            echo "Platform: \`${{ matrix.os }}\`"
            echo ""
            echo "This job proves upstream baseline parity on this platform."
            echo "It does **not** validate Bashwink code — see \`verify.yml\` for that."
          } >> "$GITHUB_STEP_SUMMARY"
