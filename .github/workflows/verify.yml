name: verify

# Bashwink Phase 0 gate.
#
# Runs on Linux and macOS because the foundation was verified on macOS arm64 only, and a
# foundation that builds on exactly one laptop is not a foundation. The Linux leg is the
# one that will catch platform assumptions.
#
# ACTIVE RUNNER LABELS: macos-15 (not macos-14 — retired 2026-11-02 per
# https://github.blog/changelog/2026-10-01-github-actions-macos-14-runner-image-retirement/).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Upstream pins Bun 1.4.4 (package.json "packageManager"). Keep them aligned so a
  # local run and CI resolve identical dependency trees.
  BUN_VERSION: "1.4.4"

jobs:
  lint:
    # BW-006 acceptance names "deterministic lint". Two distinct gates, deliberately separate:
    #   - semantic lint  (`oxlint`, correctness rules as errors, warnings denied)
    #   - formatting     (`bun fmt --check`, the pinned runtime's own formatter)
    # A formatter alone is not a linter: it rewrites whitespace and reports nothing about
    # unused bindings, unreachable code or `debugger` statements, so it never satisfied the
    # criterion on its own. `lint:gate` additionally runs a committed violation fixture
    # (fixtures/lint-violation/bad.ts) and asserts the rules actually fire, which is what
    # distinguishes a working gate from one that has only ever been seen to pass.
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Semantic lint (oxlint, pinned)
        run: bun run lint
      - name: Lint gate positive + negative control
        run: bun run lint:gate
      - name: Formatting is deterministic and enforced
        run: bun run format

  docs:
    name: docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify documentation bundle
        run: python3 scripts/verify_bashwink_docs.py

  evidence:
    name: evidence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test:evidence
      - name: Typecheck
        run: bun run typecheck
      # The evidence recorder is Bashwink's security-critical component. Run its suite
      # against the exact lockfile-pinned toolchain, not whatever the runner default is.
      - name: Evidence suite under the pinned Bun
        run: bun --version && bun test packages/bw-evidence/test/recorder.test.ts

  cli:
    # BW-008…BW-019. Runs on both platforms because the CLI is where platform assumptions
    # surface: `bun:sqlite`, symlinked plugin staging and git subprocesses all behave
    # differently on Linux.
    name: cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: CLI unit and integration tests
        run: bun run test:cli
      - name: Typecheck the CLI
        run: bun run --cwd packages/bw-cli typecheck
      # The real acceptance criterion for BW-019: kill a run, resume it, and prove it neither
      # double-applies nor falsely verifies. Not a unit test — a real SIGKILL.
      - name: Interruption and idempotent resume fixture
        run: ./fixtures/idempotent-resume/run.sh
      - name: CLI smoke (--help and --version from a clean home)
        run: |
          set -euo pipefail
          export BASHWINK_HOME="$RUNNER_TEMP/bw-smoke"

          # The two acceptance criteria for BW-008, asserted directly.
          version="$(bun run packages/bw-cli/src/bin.ts --version)"
          echo "version: $version"
          case "$version" in
            bashwink\ *) ;;
            *) echo "::error::--version did not print the Bashwink product name: $version"; exit 1 ;;
          esac
          bun run packages/bw-cli/src/bin.ts --help > /dev/null

          # `init` is the command that creates the state directories; `--version` deliberately
          # does not touch the filesystem, so asserting on it here would test nothing.
          bun run packages/bw-cli/src/bin.ts init
          test -d "$BASHWINK_HOME/data"

          # `doctor` exits 1 when a precondition is genuinely missing (no runtime on this
          # runner). That is the acceptance criterion, so assert the code rather than ignoring
          # it with `|| true` — the earlier version of this step did the latter and swallowed a
          # real failure.
          set +e
          bun run packages/bw-cli/src/bin.ts doctor > "$RUNNER_TEMP/doctor.txt" 2>&1
          doctor_rc=$?
          set -e
          cat "$RUNNER_TEMP/doctor.txt"
          if [ "$doctor_rc" -ne 1 ]; then
            echo "::error::doctor exited $doctor_rc; expected 1 with no runtime installed"
            exit 1
          fi
          grep -q "fix:" "$RUNNER_TEMP/doctor.txt" || { echo "::error::doctor gave no actionable fix"; exit 1; }
      # BW-014's end-to-end proof needs the real OpenCode binary (a ~225 MB platform package).
      # Installing it on every PR is too expensive for a workflow that runs in ~30s, so the
      # fixture detects its absence and reports SKIP with a reason rather than failing or —
      # worse — passing vacuously. `upstream-compat` installs the real tree and is where the
      # runtime is genuinely exercised; the local evidence for BW-014 is recorded in
      # TEST_EVIDENCE.md with the actual run output.
      - name: Tool lifecycle against a real runtime (skips without one)
        run: ./fixtures/tool-lifecycle/run.sh

  fixtures:
    name: fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # macOS /bin/bash is 3.2; the upstream shell suite needs bash >= 4 and goes from
      # 3 failures to 0 when a modern bash is present. Ubuntu already ships bash 5.
      - name: Ensure bash >= 4
        run: |
          set -euo pipefail
          if [ "$(bash -c 'echo ${BASH_VERSINFO[0]}')" -lt 4 ]; then
            brew install bash
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          bash --version | head -1
      # A committed identity is required or fixture commits fail on a clean runner.
      - name: Configure git
        run: |
          git config --global user.name "Bashwink CI"
          git config --global user.email "ci@bashwink.invalid"
          git config --global init.defaultBranch main
      - name: Recreate fixtures
        run: ./fixtures/create_fixtures.sh
      - name: Fixtures are at their recorded baselines
        run: ./fixtures/reset.sh --check
      - name: Dirty a fixture, then prove reset restores it
        run: |
          set -euo pipefail
          echo "dirty" >> fixtures/one-file-edit/README.md
          touch fixtures/one-file-edit/untracked.tmp
          # --check must FAIL on a dirty tree; if it passes, the gate is broken.
          if ./fixtures/reset.sh --check one-file-edit; then
            echo "FAIL: --check accepted a dirty fixture"
            exit 1
          fi
          ./fixtures/reset.sh one-file-edit
          ./fixtures/reset.sh --check one-file-edit
      - name: Fixture tests fail at baseline for the documented reason
        run: |-
          set -euo pipefail
          cd fixtures/failed-test
          # GITHUB_ACTIONS=true makes `bun test` emit every assertion failure as an
          # `::error::` workflow command. That is right for a real suite, but here the
          # failure IS the pass condition, so it painted a red X annotation on a job
          # whose every step succeeded — a green run that reads as a failed check in the
          # UI. Unset it for this one command so the job's annotations match its result.
          # The exit code is still the signal, and `bun test` fails identically without it.
          if env -u GITHUB_ACTIONS bun test; then
            echo "FAIL: failed-test fixture passed at baseline; it no longer reproduces a bug"
            exit 1
          fi
      # Cancellation and rollback were previously only created-and-reset, never exercised.
      # This asserts the gate criterion directly: a killed run must not claim completion,
      # and a revert must be byte-identical.
      - name: Cancellation and rollback scenarios
        run: ./fixtures/scenario_check.sh

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Positive control and real scan
        run: |
          set -euo pipefail
          # A scanner that never fires is untested. Prove it detects a known-bad string
          # first, then scan the tree for real. (Independent review: "positive and
          # negative secret-scan fixtures are tested".)
          tmp="$(mktemp -d)"
          printf 'const k = "sk-%s"\n' "$(printf 'A%.0s' {1..32})" > "$tmp/leak.js"
          if ! grep -rInE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' "$tmp" >/dev/null; then
            echo "FAIL: secret scanner did not detect the positive control"
            exit 1
          fi
          echo "OK: scanner detects a planted credential"

          # Deliberately NO path allowlist. An earlier revision excluded '*.md' and
          # 'mock_provider.py' to work around a false positive; the real fix was to stop
          # writing credential-shaped literals in the tree at all (see the credential()
          # helper in packages/bw-evidence/test/recorder.test.ts). A scanner with a path
          # allowlist has a blind spot that grows every time something trips it.
          if grep -rInE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=audit .; then
            echo "FAIL: possible credential committed"
            exit 1
          fi
          echo "OK: no credential patterns in the tree (no path exclusions)"

  # Licence scope gate. Deliberately NOT a blanket "no GPL anywhere" rule: the shipped
  # artifact's obligations depend on which packages actually reach the distribution.
  # This job enforces what is checkable in-tree and fails loudly on anything with no
  # recorded decision.
  license-scope:
    name: license scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Every dependency with copyleft must have a recorded decision
        run: python3 scripts/check_license_scope.py --inventory docs/bashwink/DEPENDENCY_LICENSES.json

  # Scope honesty. A green verify.yml must never be read as "the upstream 8,004-test
  # suite passed". Full upstream parity is a separate, heavier check that needs the
  # upstream clone and a ~5 minute run; it is tracked in NEXT_STEPS.md as an explicit
  # periodic compatibility job rather than being silently implied here.
  scope:
    name: scope statement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: State what this workflow does and does not prove
        run: |
          cat <<'EOF'
          This workflow proves:
            - the docs bundle is internally consistent
            - Bashwink's own evidence package passes its tests and typechecks
            - the QA fixtures reset deterministically on Linux and macOS
            - the secret scanner works and finds nothing committed
            - every copyleft dependency has a recorded licensing decision

          This workflow does NOT prove:
            - upstream OpenCode baseline parity (8,004 tests) — see NEXT_STEPS.md
            - any licence conclusion is legally sufficient — that needs counsel
            - the shipped artifact was built, signed or distributed
          EOF
