name: verify

# Bashwink Phase 0 gate.
#
# Runs on Linux and macOS because the foundation was verified on macOS arm64 only, and a
# foundation that builds on exactly one laptop is not a foundation. The Linux leg is the
# one that will catch platform assumptions.
#
# ACTIVE RUNNER LABELS: macos-15 (not macos-14 — retired 2026-11-02 per
# https://github.blog/changelog/2026-10-01-github-actions-macos-14-runner-image-retirement/).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Upstream pins Bun 1.4.4 (package.json "packageManager"). Keep them aligned so a
  # local run and CI resolve identical dependency trees.
  BUN_VERSION: "1.4.4"

jobs:
  lint:
    # BW-006 acceptance names "deterministic lint". Two distinct gates, deliberately separate:
    #   - semantic lint  (`oxlint`, correctness rules as errors, warnings denied)
    #   - formatting     (`bun fmt --check`, the pinned runtime's own formatter)
    # A formatter alone is not a linter: it rewrites whitespace and reports nothing about
    # unused bindings, unreachable code or `debugger` statements, so it never satisfied the
    # criterion on its own. `lint:gate` additionally runs a committed violation fixture
    # (fixtures/lint-violation/bad.ts) and asserts the rules actually fire, which is what
    # distinguishes a working gate from one that has only ever been seen to pass.
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Semantic lint (oxlint, pinned)
        run: bun run lint
      - name: Lint gate positive + negative control
        run: bun run lint:gate
      - name: Formatting is deterministic and enforced
        run: bun run format

  docs:
    name: docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify documentation bundle
        run: python3 scripts/verify_bashwink_docs.py
      - name: Verify release-gate acceptance and refusal controls
        run: |
          python3 scripts/test_native_release_gate.py
          python3 scripts/test_alpha_release_gate.py

  evidence:
    name: evidence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test:evidence
      - name: Typecheck
        run: bun run typecheck
      # The evidence recorder is Bashwink's security-critical component. Run its suite
      # against the exact lockfile-pinned toolchain, not whatever the runner default is.
      - name: Evidence suite under the pinned Bun
        run: bun --version && bun test packages/bw-evidence/test/recorder.test.ts

  cli:
    # BW-008…BW-019. Runs on both platforms because the CLI is where platform assumptions
    # surface: `bun:sqlite`, symlinked plugin staging and git subprocesses all behave
    # differently on Linux.
    name: cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: CLI unit and integration tests
        run: bun run test:cli
      - name: Typecheck the CLI
        run: bun run --cwd packages/bw-cli typecheck
      # BW-019's real acceptance criterion: kill a run, resume it, and prove it neither
      # double-applies nor falsely verifies. Not a unit test — a real SIGKILL.
      - name: Interruption and idempotent resume fixture
        run: ./fixtures/idempotent-resume/run.sh
      # BW-055's lifecycle: draft gate, approval, evidence linkage, revision drop semantics.
      - name: TaskContract lifecycle fixture
        run: ./fixtures/contract/run.sh
      - name: CLI smoke (--help and --version from a clean home)
        run: |
          set -euo pipefail
          export BASHWINK_HOME="$RUNNER_TEMP/bw-smoke"

          # The two acceptance criteria for BW-008, asserted directly.
          version="$(bun run packages/bw-cli/src/bin.ts --version)"
          echo "version: $version"
          case "$version" in
            bashwink\ *) ;;
            *) echo "::error::--version did not print the Bashwink product name: $version"; exit 1 ;;
          esac
          bun run packages/bw-cli/src/bin.ts --help > /dev/null

          # `init` is the command that creates the state directories; `--version` deliberately
          # does not touch the filesystem, so asserting on it here would test nothing.
          bun run packages/bw-cli/src/bin.ts init
          test -d "$BASHWINK_HOME/data"

          # `doctor` exits 1 when a precondition is genuinely missing (no runtime on this
          # runner). That is the acceptance criterion, so assert the code rather than ignoring
          # it with `|| true` — the earlier version of this step did the latter and swallowed a
          # real failure.
          set +e
          bun run packages/bw-cli/src/bin.ts doctor > "$RUNNER_TEMP/doctor.txt" 2>&1
          doctor_rc=$?
          set -e
          cat "$RUNNER_TEMP/doctor.txt"
          if [ "$doctor_rc" -ne 1 ]; then
            echo "::error::doctor exited $doctor_rc; expected 1 with no runtime installed"
            exit 1
          fi
          grep -q "fix:" "$RUNNER_TEMP/doctor.txt" || { echo "::error::doctor gave no actionable fix"; exit 1; }
      # BW-014's end-to-end proof needs the real OpenCode binary (a ~225 MB platform package).
      # Installing it on every PR is too expensive for a workflow that runs in ~30s, so the
      # fixture detects its absence and reports SKIP with a reason rather than failing or —
      # worse — passing vacuously. `upstream-compat` installs the real tree and is where the
      # runtime is genuinely exercised; the local evidence for BW-014 is recorded in
      # TEST_EVIDENCE.md with the actual run output.
      - name: Tool lifecycle against a real runtime (skips without one)
        run: ./fixtures/tool-lifecycle/run.sh

  runtime-health:
    # The silent-failure defect existed precisely because the only real-runtime fixture was
    # skipped in CI: a green pipeline never loaded the plugin. This job installs the pinned
    # runtime and makes the guarantee enforceable. It is the one place where a 225 MB install
    # is worth the cost, and it runs on both platforms because the plugin-staging mechanism is
    # symlink-based and therefore platform-sensitive.
    name: runtime health (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install the pinned OpenCode runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime"
          cd "$RUNNER_TEMP/runtime"
          # Bun 1.4 blocks postinstall scripts by default, and @opencode/cli's postinstall is
          # what places the platform binary. Without this allow-list `bun add` succeeds but the
          # binary is a stub — CI found that, not a local run, because the local install had
          # already run with scripts enabled.
          printf '%s\n' '{"name":"runtime-probe","private":true,"trustedDependencies":["@opencode/cli"]}' > package.json
          bun add "@opencode/cli@2.3.2"
          test -x node_modules/.bin/opencode
          echo "BASHWINK_OPENCODE_BIN=$RUNNER_TEMP/runtime/node_modules/.bin/opencode" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/runtime/node_modules/.bin/opencode" --version
      - name: Plugin boot handshake and failure paths (real binary)
        run: ./fixtures/runtime-health/run.sh
      # The runtime is already installed for this job, so the BW-014 lifecycle proof runs here
      # too. It used to skip in the `cli` job — which is precisely why a broken plugin could
      # reach a green pipeline.
      - name: Tool lifecycle against the real runtime
        run: ./fixtures/tool-lifecycle/run.sh

  fixtures:
    name: fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # macOS /bin/bash is 3.2; the upstream shell suite needs bash >= 4 and goes from
      # 3 failures to 0 when a modern bash is present. Ubuntu already ships bash 5.
      - name: Ensure bash >= 4
        run: |
          set -euo pipefail
          if [ "$(bash -c 'echo ${BASH_VERSINFO[0]}')" -lt 4 ]; then
            brew install bash
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          bash --version | head -1
      # A committed identity is required or fixture commits fail on a clean runner.
      - name: Configure git
        run: |
          git config --global user.name "Bashwink CI"
          git config --global user.email "ci@bashwink.invalid"
          git config --global init.defaultBranch main
      - name: Recreate fixtures
        run: ./fixtures/create_fixtures.sh
      - name: Fixtures are at their recorded baselines
        run: ./fixtures/reset.sh --check
      - name: Dirty a fixture, then prove reset restores it
        run: |
          set -euo pipefail
          echo "dirty" >> fixtures/one-file-edit/README.md
          touch fixtures/one-file-edit/untracked.tmp
          # --check must FAIL on a dirty tree; if it passes, the gate is broken.
          if ./fixtures/reset.sh --check one-file-edit; then
            echo "FAIL: --check accepted a dirty fixture"
            exit 1
          fi
          ./fixtures/reset.sh one-file-edit
          ./fixtures/reset.sh --check one-file-edit
      - name: Fixture tests fail at baseline for the documented reason
        run: |-
          set -euo pipefail
          cd fixtures/failed-test
          # GITHUB_ACTIONS=true makes `bun test` emit every assertion failure as an
          # `::error::` workflow command. That is right for a real suite, but here the
          # failure IS the pass condition, so it painted a red X annotation on a job
          # whose every step succeeded — a green run that reads as a failed check in the
          # UI. Unset it for this one command so the job's annotations match its result.
          # The exit code is still the signal, and `bun test` fails identically without it.
          if env -u GITHUB_ACTIONS bun test; then
            echo "FAIL: failed-test fixture passed at baseline; it no longer reproduces a bug"
            exit 1
          fi
      # Cancellation and rollback were previously only created-and-reset, never exercised.
      # This asserts the gate criterion directly: a killed run must not claim completion,
      # and a revert must be byte-identical.
      - name: Cancellation and rollback scenarios
        run: ./fixtures/scenario_check.sh

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Positive control and real scan
        run: |
          set -euo pipefail
          # A scanner that never fires is untested. Prove it detects a known-bad string
          # first, then scan the tree for real. (Independent review: "positive and
          # negative secret-scan fixtures are tested".)
          tmp="$(mktemp -d)"
          printf 'const k = "sk-%s"\n' "$(printf 'A%.0s' {1..32})" > "$tmp/leak.js"
          if ! grep -rInE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' "$tmp" >/dev/null; then
            echo "FAIL: secret scanner did not detect the positive control"
            exit 1
          fi
          echo "OK: scanner detects a planted credential"

          # Deliberately NO path allowlist. An earlier revision excluded '*.md' and
          # 'mock_provider.py' to work around a false positive; the real fix was to stop
          # writing credential-shaped literals in the tree at all (see the credential()
          # helper in packages/bw-evidence/test/recorder.test.ts). A scanner with a path
          # allowlist has a blind spot that grows every time something trips it.
          if grep -rInE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=audit .; then
            echo "FAIL: possible credential committed"
            exit 1
          fi
          echo "OK: no credential patterns in the tree (no path exclusions)"

  # Legacy v0.1.0-alpha.1 package build/verification (superseded by standalone v0.2.0-alpha.2).
  # Preserved for manual rollback verification via `workflow_dispatch` instead of blocking standalone PRs
  # after `release/npm/` switched to the pure-Node standalone entrypoint (BW-AUD-053 / ADR-015).
  npm-package:
    name: legacy npm package (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Zig 0.16.0 and 0.17.0 (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/toolchains
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)    zarch="x86_64-linux" ;;
            Linux-ARM64)  zarch="aarch64-linux" ;;
            macOS-ARM64)  zarch="aarch64-macos" ;;
            macOS-X64)    zarch="x86_64-macos" ;;
            *) echo "Unsupported runner ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          for ver in 0.16.0 0.17.0; do
            url="https://ziglang.org/download/${ver}/zig-${zarch}-${ver}.tar.xz"
            curl -fsSL "$url" -o "/tmp/zig-${ver}.tar.xz"
            tar -xJf "/tmp/zig-${ver}.tar.xz" -C build/toolchains
            rm -f "/tmp/zig-${ver}.tar.xz"
          done
      - name: Install pinned Zig 0.16.0 and 0.17.0 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build\toolchains | Out-Null
          foreach ($ver in @("0.16.0", "0.17.0")) {
            $zip = "$env:RUNNER_TEMP\zig-$ver.zip"
            Invoke-WebRequest -Uri "https://ziglang.org/download/$ver/zig-x86_64-windows-$ver.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath build\toolchains -Force
            Remove-Item $zip -Force
          }
      - name: Check Bun installation consent
        run: python scripts/test_npm_bun_consent.py
      - name: Check local engine build invariants
        run: python scripts/test_local_engine_build.py
      - name: Build and install from source (Linux)
        if: runner.os == 'Linux'
        env:
          npm_config_ignore_scripts: "true"
          npm_config_prefix: ${{ runner.temp }}/bashwink-source-install
        run: |
          printf 'y\n' | python3 scripts/build_npm_package.py --install --out build/npm
          "$npm_config_prefix/bin/bashwink" --version
      - name: Build and install from source (Windows)
        if: runner.os == 'Windows'
        env:
          npm_config_ignore_scripts: "true"
          npm_config_prefix: ${{ runner.temp }}\bashwink-source-install
        run: |
          'y' | python scripts/build_npm_package.py --install --out build/npm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:npm_config_prefix 'bashwink.cmd') --version
      - name: Build and install from source (macOS)
        if: runner.os == 'macOS'
        env:
          npm_config_ignore_scripts: "true"
          npm_config_prefix: ${{ runner.temp }}/bashwink-source-install
        run: |
          printf 'y\n' | python3 scripts/build_npm_package.py --install --out build/npm
          "$npm_config_prefix/bin/bashwink" --version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Portable unit tests (launcher platform plan, plugin staging, home directory)
        run: bun test packages/bw-cli/test/npm-launcher.test.ts packages/bw-cli/test/plugin-staging.test.ts packages/bw-cli/test/usage-guard.test.ts packages/bw-cli/test/engine-manifest.test.ts packages/bw-cli/test/standard-launcher-manifest.test.ts
      - name: Install the tarball and exercise the installed command
        run: python scripts/npm_install_check.py build/npm/bashwink-0.1.0-alpha.1.tgz --out build/npm/install-check.json
      # The installed command against a scripted provider: coding task, session continuation and model switch, the
      # permission negative controls, credential containment, cancellation and cleanup, and the usage limits. This is
      # a hosted-runner result; it is not an interactive qualification of a Windows 11 desktop, and the scripted
      # provider is not a live model.
      - name: Qualify the installed package (scripted provider)
        if: ${{ !cancelled() }}
        run: python fixtures/release/npm_qual.py build/npm/bashwink-0.1.0-alpha.1.tgz --out build/npm/qualification.json
      # The interactive screen of the installed package in a real pseudo-terminal (trust question, the persistent mode
      # label, a second launch). POSIX only: there is no Windows pseudo-terminal harness, so the Windows screen is a
      # manual-checklist item (release/tester-kit/WINDOWS_TESTER_CHECKLIST.md), not something this job claims.
      - name: Interactive smoke test of the installed package (PTY)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: |
          python -m pip install pyte==0.8.2
          python fixtures/release/npm_smoke.py build/npm/bashwink-0.1.0-alpha.1.tgz --out build/npm/tui-smoke.json
      # Validates the tester-kit script itself under Windows PowerShell 5.1 (no provider, so no live steps).
      - name: Run the Windows tester-kit script
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: powershell
        run: .\release\tester-kit\windows-qualify.ps1 -Tarball build\npm\bashwink-0.1.0-alpha.1.tgz -Out build\npm\tester-kit-result.json
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: npm-package-${{ matrix.os }}
          path: build/npm/*.json
          if-no-files-found: warn
  # Informational only, and labelled so: the full CLI suite was written on macOS and Linux. Its first Windows run
  # establishes the baseline of what still assumes a POSIX host; until that list is triaged it cannot gate.
  windows-full-suite:
    name: full CLI suite on Windows (informational, not a gate)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: CLI suite (failures here are the Windows to-do list)
        run: bun run test:cli

  standalone:
    name: standalone (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        node: ["22.13.0", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Standalone unit & loop tests (Node >=22.13.0)
        run: npm run test:standalone
      - name: Standalone tarball build, audit, install, upgrade & uninstall
        run: npm run test:standalone:install
      - name: Physical absence & independence check (no vendor/, Bun, OpenCode, Hermes, Pi)
        run: npm run test:standalone:independence
      - name: Interactive PTY / ConPTY end-to-end onboarding, coding, failure & cancellation
        run: npm run test:standalone:e2e

  # Licence scope gate. Deliberately NOT a blanket "no GPL anywhere" rule: the shipped
  # artifact's obligations depend on which packages actually reach the distribution.
  # This job enforces what is checkable in-tree and fails loudly on anything with no
  # recorded decision.
  license-scope:
    name: license scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Every dependency with copyleft must have a recorded decision
        run: python3 scripts/check_license_scope.py --inventory docs/bashwink/DEPENDENCY_LICENSES.json

  # Scope honesty. A green verify.yml must never be read as "the upstream 8,004-test
  # suite passed". Full upstream parity is a separate, heavier check that needs the
  # upstream clone and a ~5 minute run; it is tracked in NEXT_STEPS.md as an explicit
  # periodic compatibility job rather than being silently implied here.
  scope:
    name: scope statement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: State what this workflow does and does not prove
        run: |
          cat <<'EOF'
          This workflow proves:
            - standalone v0.2.0-alpha.2 product gates (`standalone`: Node >=22.13.0 unit/loop, tarball install lifecycle, physical independence, PTY E2E)
            - the docs bundle is internally consistent
            - Bashwink's evidence package & CLI workspace tests pass typecheck, lint, format, and unit checks
            - the QA fixtures reset deterministically on Linux and macOS
            - the secret scanner positive control fires and finds zero credential patterns in the tree
            - every copyleft dependency has a recorded licensing decision

          Legacy v0.1.0-alpha.1 rollback packaging (`legacy npm package`) is isolated to manual `workflow_dispatch` runs (BW-AUD-053 / ADR-015).

          This workflow does NOT prove:
            - upstream OpenCode baseline parity (8,004 tests) — see NEXT_STEPS.md
            - any licence conclusion is legally sufficient — that needs counsel
            - the shipped artifact was built, signed or distributed
          EOF
